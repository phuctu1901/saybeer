<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>SayBeer - Active Lock</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            },
            dark: {
              900: '#0d0b08',
              850: '#14100b',
              800: '#1c160f',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"SF Mono"', 'ui-monospace', 'Menlo', 'monospace']
          },
          boxShadow: {
            'amber-glow': '0 0 50px -10px rgba(245, 158, 11, 0.25)',
            'amber-glow-strong': '0 0 70px 0px rgba(217, 119, 6, 0.35)',
          }
        }
      }
    }
  </script>
<!-- Custom Typography & Glow Styles -->
<style data-purpose="custom-styling">
    @layer utilities {
      .text-glow {
        text-shadow: 0 0 35px rgba(245, 158, 11, 0.45), 0 0 15px rgba(245, 158, 11, 0.3);
      }
      .bg-radial-ambient {
        background: radial-gradient(circle at 50% 32%, rgba(217, 119, 6, 0.18) 0%, rgba(13, 11, 8, 0) 70%);
      }
    }
  </style>
</head>
<body class="bg-dark-900 text-neutral-200 antialiased min-h-screen flex flex-col justify-between select-none overflow-x-hidden font-sans relative">
<!-- Ambient Amber Glow Background -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none bg-radial-ambient z-0"></div>
<!-- Main Container constrained to Mobile iOS max width -->
<div class="relative z-10 w-full max-w-md mx-auto flex flex-col min-h-screen justify-between px-6 pt-12 pb-8">
<!-- BEGIN: TopHeader -->
<header class="flex items-center justify-between w-full pt-2">
<!-- App Brand Logo / Title -->
<div class="tracking-widest font-black text-amber-500 text-lg uppercase flex items-center gap-1.5" data-purpose="app-brand">
<span>SAYBEER</span>
</div>
<!-- Privacy Status Tag -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-sm font-medium backdrop-blur-md" data-purpose="privacy-status">
<svg class="w-4 h-4 text-amber-400" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M12.516 2.17a.75.75 0 0 0-1.032 0 11.209 11.209 0 0 1-7.877 3.08.75.75 0 0 0-.722.515A12.74 12.74 0 0 0 2.25 9.75c0 5.942 4.064 10.933 9.563 12.348a.749.749 0 0 0 .374 0c5.499-1.415 9.563-6.406 9.563-12.348 0-1.39-.223-2.73-.635-3.985a.75.75 0 0 0-.722-.516l-.143.001c-2.996 0-5.717-1.17-7.734-3.08Zm3.094 8.016a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" fill-rule="evenodd"></path>
</svg>
<span class="text-xs font-semibold tracking-wide">Riêng tư</span>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: LockStatusDisplay -->
<main class="flex flex-col items-center justify-center my-auto py-8 text-center" data-purpose="active-lock-countdown">
<!-- Lock Icon with Ambient Rounded Glow Box -->
<div class="relative mb-7">
<div class="w-24 h-24 rounded-3xl bg-gradient-to-b from-amber-600/30 to-amber-900/20 border border-amber-500/30 flex items-center justify-center shadow-amber-glow backdrop-blur-md">
<svg class="w-11 h-11 text-amber-400" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
<!-- Lock Status Subhead -->
<h2 class="text-xl sm:text-2xl font-bold tracking-tight text-white mb-2" data-purpose="status-count">
        Đang khóa 1 app
      </h2>
<!-- Giant Digital Countdown Display -->
<div class="my-2" data-purpose="countdown-clock">
<span class="font-mono text-5xl sm:text-6xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-amber-300 via-amber-400 to-amber-500 text-glow">
          15:19:13
        </span>
</div>
<!-- Unlock Target Time -->
<div class="mt-2 text-neutral-400 font-medium text-base flex items-center gap-1.5" data-purpose="unlock-time">
<span>Tự mở khóa lúc</span>
<span class="text-neutral-200 font-semibold">06:00</span>
</div>
<!-- Reassurance Information Text -->
<p class="mt-6 text-neutral-400 text-sm leading-relaxed max-w-xs font-normal" data-purpose="reassurance-note">
        Thông báo và cuộc gọi vẫn hoạt động. SayBeer chỉ chặn mở các app bạn đã chọn.
      </p>
</main>
<!-- END: LockStatusDisplay -->
<!-- BEGIN: ActionControls -->
<section class="flex flex-col gap-3.5 w-full pt-4" data-purpose="interactive-actions">
<!-- Primary Action: Temporary Quick Access -->
<button class="w-full py-4 px-5 rounded-2xl bg-neutral-900/80 hover:bg-neutral-800/90 active:scale-[0.98] transition-all duration-200 border border-amber-500/20 hover:border-amber-500/40 text-neutral-200 font-medium text-base flex items-center justify-center gap-2 shadow-sm backdrop-blur-md" data-purpose="temporary-bypass-btn" type="button">
<span>Cần nhắn việc</span>
<span class="text-amber-500/50">•</span>
<span class="text-neutral-300">15 phút</span>
<span class="text-xs text-amber-500/80 bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/20 font-normal">
          còn 3 lần
        </span>
</button>
<!-- Secondary Action: Complete Unlock Verification -->
<button class="w-full py-4 px-5 rounded-2xl bg-neutral-900/40 hover:bg-neutral-800/60 active:scale-[0.98] transition-all duration-200 border border-neutral-700/60 hover:border-neutral-600 text-neutral-300 font-medium text-base text-center backdrop-blur-md" data-purpose="complete-unlock-btn" type="button">
        Tỉnh rồi — mở khóa hẳn
      </button>
<!-- Emergency SOS Action -->
<button class="mt-2 py-3 px-4 text-center text-rose-400/90 hover:text-rose-300 active:scale-95 transition-all duration-200 text-sm font-semibold tracking-wide flex items-center justify-center gap-1.5" data-purpose="sos-emergency-btn" type="button">
<span class="uppercase tracking-wider">SOS</span>
<span>Khẩn cấp</span>
</button>
<!-- iOS Home Bar Indicator Spacer -->
<div aria-hidden="true" class="w-32 h-1 bg-neutral-800/80 rounded-full mx-auto mt-2"></div>
</section>
<!-- END: ActionControls -->
</div>
</body></html>
