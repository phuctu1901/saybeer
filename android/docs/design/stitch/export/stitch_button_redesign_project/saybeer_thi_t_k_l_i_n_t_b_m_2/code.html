<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>SayBeer - Hãy say bia, đừng "say" bậy</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#120E0A',
              card: 'rgba(32, 24, 18, 0.75)',
              gold: '#F59E0B',
              amber: '#FFB300',
              accent: '#E58E1A',
              border: 'rgba(245, 158, 11, 0.15)',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          boxShadow: {
            'glow': '0 8px 30px -4px rgba(245, 158, 11, 0.45), 0 2px 10px -2px rgba(245, 158, 11, 0.3)',
            'glass': '0 4px 20px 0 rgba(0, 0, 0, 0.45)',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Atmospheric Visuals -->
<style data-purpose="background-and-effects">
    body {
      background-color: #0F0B08;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Radial ambient glow in center */
    .ambient-glow {
      background: radial-gradient(circle 350px at 50% 38%, rgba(245, 158, 11, 0.12) 0%, rgba(18, 14, 10, 0) 100%);
    }

    /* Glassmorphism subtle surface */
    .glass-card {
      background: linear-gradient(135deg, rgba(38, 29, 21, 0.7) 0%, rgba(22, 17, 12, 0.85) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 166, 35, 0.18);
    }

    .glass-card:active {
      background: linear-gradient(135deg, rgba(48, 36, 26, 0.85) 0%, rgba(30, 22, 15, 0.95) 100%);
      border-color: rgba(245, 166, 35, 0.35);
      transform: scale(0.98);
    }

    .cta-button {
      background: linear-gradient(135deg, #FFC107 0%, #FF9800 50%, #F57C00 100%);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cta-button:active {
      transform: scale(0.975);
      filter: brightness(0.95);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 m-0 overflow-x-hidden antialiased">
<!-- Mobile Container Wrapper -->
<main class="relative w-full max-w-md min-h-screen flex flex-col justify-between overflow-hidden ambient-glow px-6 pt-12 pb-7">
<!-- BEGIN: HeaderSection -->
<header class="w-full flex items-center justify-between z-10 select-none">
<!-- App Wordmark / Small Logo -->
<div class="flex items-center gap-1.5" data-purpose="app-branding">
<span class="text-xs font-black tracking-widest text-[#F5A623] uppercase">SAYBEER</span>
</div>
<!-- Privacy / Shield Indicator Badge -->
<button aria-label="Chế độ riêng tư" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-[#F5A623] text-xs font-medium hover:bg-amber-500/15 transition-colors" type="button">
<!-- Shield Icon -->
<svg aria-hidden="true" class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 9.04-7 10.18-3.87-1.14-7-5.51-7-10.18V6.3l7-3.12z" opacity="0.4"></path>
<path d="M12 2.18L5 5.3v5.7c0 4.67 3.13 9.04 7 10.18 3.87-1.14 7-5.51 7-10.18V5.3l-7-3.12z"></path>
</svg>
<span>Riêng tư</span>
</button>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: HeroSection -->
<section class="flex flex-col items-center justify-center text-center my-auto py-8 z-10" data-purpose="hero-brand-statement">
<!-- Beer Mug Emblem with Glow -->
<div class="relative mb-6 group cursor-pointer" data-purpose="beer-icon-container">
<!-- Ambient Amber Glow behind icon -->
<div class="absolute -inset-4 bg-[#F5A623]/20 rounded-full blur-xl pointer-events-none"></div>
<!-- Custom Beer Foam & Mug SVG Icon -->
<div class="relative w-28 h-28 flex items-center justify-center">
<svg aria-hidden="true" class="w-24 h-24 text-[#F5A623] drop-shadow-md transform transition-transform group-hover:scale-105 duration-300" fill="currentColor" viewbox="0 0 64 64">
<!-- Foam -->
<path d="M22 14c-2.8 0-5 2.2-5 5 0 .6.1 1.1.3 1.6C15.4 21.2 14 23 14 25.1c0 2.5 1.8 4.6 4.2 5 .2 1.1.8 2.1 1.7 2.8.9.7 2 1.1 3.1 1.1h18c1.7 0 3.2-.8 4.1-2.1 1.6-.5 2.9-2 2.9-3.9 0-1.8-1.1-3.3-2.6-3.8.4-.7.6-1.5.6-2.3 0-2.8-2.2-5-5-5-.4 0-.8.1-1.2.2C38.6 15 35.6 13 32 13c-3.1 0-5.8 1.5-7.4 3.8-.8-.5-1.7-.8-2.6-.8z"></path>
<!-- Beer Mug Body and Liquid -->
<path d="M19 28v18c0 4.4 3.6 8 8 8h10c4.4 0 8-3.6 8-8V28H19zm19 16c0 1.1-.9 2-2 2H28c-1.1 0-2-.9-2-2v-9h12v9z" opacity="0.95"></path>
<!-- Mug Handle -->
<path d="M45 28.5v12.2c0 3.5 2.8 6.3 6.3 6.3h.2c3.5 0 6.3-2.8 6.3-6.3V31c0-2.8-2.2-5-5-5h-7.8v2.5zm7.8 15c-1.5 0-2.8-1.3-2.8-2.8V31c0-.3.2-.5.5-.5h2.3c1.4 0 2.5 1.1 2.5 2.5v7.2c0 1.5-1.1 2.8-2.5 2.8z"></path>
<!-- Carbonation Bubbles -->
<circle cx="27" cy="40" fill="#FFF275" opacity="0.7" r="1.5"></circle>
<circle cx="33" cy="35" fill="#FFF275" opacity="0.6" r="1.2"></circle>
<circle cx="30" cy="45" fill="#FFF275" opacity="0.8" r="1"></circle>
</svg>
</div>
</div>
<!-- Main Headline -->
<h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white mb-4">
        SayBeer
      </h1>
<!-- Slogan with refined typography -->
<p class="text-lg sm:text-xl text-[#B8A793] font-normal leading-relaxed max-w-xs">
        Hãy say bia.<br/>
        Xin đừng <span class="text-[#F5A623] font-medium">“say”</span> bậy.
      </p>
</section>
<!-- END: HeroSection -->
<!-- BEGIN: ActionControlsSection -->
<section class="w-full flex flex-col gap-3.5 z-10" data-purpose="interactive-actions">
<!-- Primary Action CTA Button -->
<button aria-label="Bắt đầu chế độ nhậu" class="cta-button w-full py-4 px-6 rounded-2xl flex items-center justify-center gap-3 text-[#1C1204] font-bold text-lg tracking-wide shadow-glow transition duration-200" type="button">
<!-- Sparkle/Beer pint icon -->
<svg aria-hidden="true" class="w-6 h-6 fill-current" viewbox="0 0 24 24">
<path d="M4 3h16l-2 14c-.1 1.7-1.5 3-3.2 3H9.2C7.5 20 6.1 18.7 6 17L4 3zm13.8 2H6.2l1.6 11.8c.1.6.6 1.2 1.4 1.2h5.6c.7 0 1.3-.5 1.4-1.2L17.8 5z"></path>
<path d="M8 7h8v2H8zm1 4h6v2H9z"></path>
</svg>
<span>Bắt đầu chế độ nhậu</span>
</button>
<!-- Secondary Actions: Ergonomic Grid (Hẹn lịch & Thống kê) -->
<div class="grid grid-cols-2 gap-3 pt-0.5" data-purpose="secondary-navigation-controls">
<!-- Button: Hẹn lịch -->
<button aria-label="Hẹn lịch nhậu" class="glass-card py-3.5 px-4 rounded-xl flex items-center justify-center gap-2.5 transition-all text-left group" type="button">
<div class="w-8 h-8 rounded-lg bg-amber-500/10 flex items-center justify-center text-[#F5A623] group-hover:bg-amber-500/20 transition-colors">
<!-- Calendar Icon -->
<svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
<circle cx="8" cy="14" fill="currentColor" r="1"></circle>
<circle cx="12" cy="14" fill="currentColor" r="1"></circle>
<circle cx="16" cy="14" fill="currentColor" r="1"></circle>
</svg>
</div>
<span class="text-sm font-medium text-[#E0D5C7] tracking-wide">Hẹn lịch</span>
</button>
<!-- Button: Thống kê -->
<button aria-label="Thống kê" class="glass-card py-3.5 px-4 rounded-xl flex items-center justify-center gap-2.5 transition-all text-left group" type="button">
<div class="w-8 h-8 rounded-lg bg-amber-500/10 flex items-center justify-center text-[#F5A623] group-hover:bg-amber-500/20 transition-colors">
<!-- Bar Chart Icon -->
<svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-sm font-medium text-[#E0D5C7] tracking-wide">Thống kê</span>
</button>
</div>
</section>
<!-- END: ActionControlsSection -->
<!-- BEGIN: HomeIndicator -->
<!-- iOS Home Indicator bar -->
<div class="w-full flex justify-center pt-5" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-white/20 rounded-full"></div>
</div>
<!-- END: HomeIndicator -->
</main>
</body></html>
